name: Build IPA (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app for device (unsigned)
        run: |
          xcodebuild build \
            -project DDOSPrototype.xcodeproj \
            -scheme DDOSPrototype \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found"
            exit 1
          fi
          echo "✅ Found app at $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DDOSPrototype.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DDOSPrototype-unsigned.ipa
          path: DDOSPrototype.ipa
