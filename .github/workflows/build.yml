name: Build for Simulator (no signing)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for simulator with verbose output
        run: |
          xcodebuild build \
            -project DDOSPrototype.xcodeproj \
            -scheme DDOSPrototype \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -verbose

      - name: Show build output structure
        run: |
          echo "=== DerivedData contents ==="
          ls -la ./DerivedData || echo "DerivedData not found"
          echo "=== Find .app files ==="
          find . -name "*.app" -type d
          echo "=== Build log ==="
          cat build.log || echo "No build.log"

      - name: Find and zip .app
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found, exiting"
            exit 1
          fi
          echo "✅ Found app at $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r DDOSPrototype.app.zip "$(basename "$APP_PATH")"
          echo "✅ Zipped app"

      - name: Upload .app.zip
        uses: actions/upload-artifact@v4
        with:
          name: DDOSPrototype-simulator-app
          path: DDOSPrototype.app.zip
